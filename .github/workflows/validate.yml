name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate.sh
      - name: Installer smoke test
        run: |
          export HOME="$(mktemp -d)"
          bash install.sh
          bash install.sh --dry-run
          bash install.sh --uninstall
